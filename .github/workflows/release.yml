name: Build Windows + macOS

# Every push to main (and every PR) builds both zips. They're kept on the run page
# (Actions tab -> the run -> Artifacts) and nothing is published.
#
# A release only happens when you ask for one: Actions -> "Build Windows + macOS" ->
# Run workflow -> type the version (e.g. v0.3.0-beta). That builds, then creates the
# tag and the GitHub release with both zips attached. The version must match
# `version` in Cargo.toml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release version to publish, e.g. v0.3.0-beta (must match Cargo.toml). Leave empty to just build."
        required: false
        default: ""

# A newer push to the same branch makes an older build pointless. Release runs always finish.
concurrency:
  group: build-${{ github.ref }}-${{ github.event.inputs.release }}
  cancel-in-progress: ${{ github.event.inputs.release == '' }}

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows x64 zip
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 + UCRT64 toolchain + libgphoto2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-libgphoto2

      - name: Install Rust (stable + windows-gnu target)
        shell: cmd
        run: |
          curl -sSf --output rustup-init.exe https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-gnu/rustup-init.exe
          rustup-init.exe -y --default-toolchain stable-x86_64-pc-windows-gnu --target x86_64-pc-windows-gnu
          echo %USERPROFILE%\.cargo\bin>>%GITHUB_PATH%

      - name: Set build env
        run: |
          echo "PATH=/ucrt64/bin:$PATH" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/ucrt64/lib/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "LIBCLANG_PATH=/ucrt64/bin" >> $GITHUB_ENV
          echo "MINGW_PREFIX=/ucrt64" >> $GITHUB_ENV

      - name: Build (with gphoto2)
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:$PATH"
          cargo build --release --features gphoto2 \
            -p dragonslayer-cli -p dragonslayer-app \
            --target x86_64-pc-windows-gnu

      - name: Grab Zadig
        run: |
          curl -L -o target/x86_64-pc-windows-gnu/release/zadig.exe \
            https://github.com/pbatard/libwdi/releases/download/v1.5.1/zadig-2.9.exe

      - name: Package
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:$PATH"
          bash scripts/package-windows.sh

      - name: Keep zip on the run page
        uses: actions/upload-artifact@v4
        with:
          name: dragonslayer-windows-x64
          path: target/dist/dragonslayer-*-windows-x64.zip
          retention-days: 30

  # ------------------------------------------------------------- macOS arm64
  # scripts/package-macos.sh is Apple Silicon–only for now (its bundled ffmpeg
  # is an arm64 static build). Intel-mac support can be added later by teaching
  # the script to swap ffmpeg by arch and re-adding a matrix entry here.
  macos:
    name: macOS arm64 zip
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Install libgphoto2 + pkg-config
        run: |
          brew install libgphoto2 pkg-config

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Test
        run: cargo test --workspace

      - name: Build & bundle
        run: bash scripts/package-macos.sh

      - name: Keep zip on the run page
        uses: actions/upload-artifact@v4
        with:
          name: dragonslayer-macos-arm64
          path: target/dist/dragonslayer-*-macos-arm64.zip
          retention-days: 30

  # ------------------------------------------------------------- release (manual only)
  release:
    name: Publish release ${{ github.event.inputs.release }}
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release != ''
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches Cargo.toml
        run: |
          WANT="${{ github.event.inputs.release }}"
          HAVE="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$WANT" != "$HAVE" ]; then
            echo "::error::Asked to release $WANT but Cargo.toml says $HAVE. Bump the version in Cargo.toml, push, then run this again."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create tag + release with both zips
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release }}"
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          ls -la dist
          gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "DragonSlayer $TAG" --generate-notes $PRE
