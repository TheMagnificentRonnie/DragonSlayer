[package]
name = "dragonslayer-app"
description = "DragonSlayer desktop app (egui + wgpu)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "dragonslayer-app"
path = "src/main.rs"

[features]
default = []
gphoto2 = ["dragonslayer-camera/gphoto2"]

[dependencies]
dragonslayer-core = { path = "../dragonslayer-core" }
dragonslayer-camera = { path = "../dragonslayer-camera" }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "x11", "wayland"] }
egui_dock = "0.21"
egui-phosphor = "0.14"
image = { workspace = true }
jpeg-decoder = "0.3"
dirs = "6"
serde = { workspace = true }
serde_json = { workspace = true }
rfd = "0.17"
keepawake = "0.6"
rodio = { version = "0.22", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }
tempfile = { workspace = true }
